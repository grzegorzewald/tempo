name: Release and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-and-deploy
  cancel-in-progress: false

jobs:
  release:
    name: Create release PR or publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check release PR permissions
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          node --input-type=module <<'JS'
          // Custom tokens use their own permissions rather than this Actions setting.
          if (process.env.HAS_RELEASE_TOKEN === 'true') process.exit(0);
          const settings = `https://github.com/${process.env.GH_REPOSITORY}/settings/actions`;
          const response = await fetch(`${process.env.GH_API_URL}/repos/${process.env.GH_REPOSITORY}/actions/permissions/workflow`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
          });
          if (!response.ok) {
            console.log(`::warning::Cannot inspect repository Actions settings (HTTP ${response.status}). If release PR creation is denied, enable "Allow GitHub Actions to create and approve pull requests" at ${settings}, or configure RELEASE_PLEASE_TOKEN.`);
          } else if (!(await response.json()).can_approve_pull_request_reviews) {
            console.log(`::error::Release PR creation is disabled. Enable "Allow GitHub Actions to create and approve pull requests" at ${settings}, then rerun this workflow. An organization policy may also need to allow it. Alternatively configure RELEASE_PLEASE_TOKEN.`);
            process.exit(1);
          }
          JS
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          # An app/PAT token also triggers PR checks on automated release PRs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    name: Deploy released site to GitHub Pages
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test release
        run: node --test
      - name: Stamp offline cache with release version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const { version } = JSON.parse(readFileSync('dist/app-metadata.json', 'utf8'));
          assert.match(version, /^\d+\.\d+\.\d+(?:-[\w.-]+)?$/);
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Release tag and app version must match');
          const source = readFileSync('dist/sw.js', 'utf8');
          assert.match(source, /const CACHE='[^']+';/);
          writeFileSync('dist/sw.js', source.replace(/const CACHE='[^']+';/, `const CACHE='tempo-release-${version}';`));
          JS
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
